<aside class="sidebar" [class.open]="isOpen()" aria-label="Navegación principal">
  <div class="sidebar-brand">
    <div class="brand-mark" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <div class="brand-copy">
      <strong>ISP Max</strong>
      <small>Panel de operación</small>
    </div>
    <button class="close-btn" type="button" aria-label="Cerrar menú" title="Cerrar menú" (click)="closeSidebar()">
      <svg lucideX size="20"></svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    @for (group of groups(); track group.id) {
      <section class="nav-group" [attr.aria-labelledby]="'nav-' + group.id">
        <p class="nav-eyebrow" [id]="'nav-' + group.id">{{ group.label }}</p>
        @for (item of group.items; track item.label) {
          <a
            class="nav-item"
            [class.active]="isItemActive(item)"
            [routerLink]="item.path"
            [queryParams]="item.queryParams ?? null"
            [attr.aria-current]="isItemActive(item) ? 'page' : null"
            (click)="closeSidebar()"
          >
            <app-nav-icon class="nav-icon" [icon]="item.icon" [size]="17" />
            <span class="nav-label">{{ item.label }}</span>
            @if (item.live) { <span class="live-dot" title="Actualización activa"></span> }
          </a>
        }
      </section>
    }
  </nav>

  <div class="sidebar-footer">
    <div [class]="'sync-status ' + systemState().tone" role="status">
      <span class="sync-dot" aria-hidden="true"></span>
      <span><strong>{{ systemState().title }}</strong><small>{{ systemState().detail }}</small></span>
    </div>
    <div class="user-chip">
      <span class="avatar" aria-hidden="true">{{ userInitials() }}</span>
      <span class="user-copy"><strong>{{ userName() }}</strong><small>{{ roleLabel() }}</small></span>
      <button class="logout-btn" type="button" (click)="logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg lucideLogOut size="17"></svg>
      </button>
    </div>
  </div>
</aside>
